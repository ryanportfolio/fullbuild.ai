spring:
  application:
    name: threadline-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:4}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 24KB
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 1MB

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

threadline:
  webhook:
    secret: ${WEBHOOK_HMAC_SECRET}

logging:
  pattern:
    correlation: "[%X{correlationId:-no-correlation}] "

---
spring:
  config:
    activate:
      on-profile: mssql
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    locations: classpath:db/migration/mssql
