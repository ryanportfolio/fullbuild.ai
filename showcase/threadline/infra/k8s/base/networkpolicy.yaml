apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: threadline-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: threadline-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
