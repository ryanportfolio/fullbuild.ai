apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: threadline
resources:
  - ../../base
images:
  - name: threadline-api
    newName: fullbuild.azurecr.io/threadline-api
    newTag: "sha-000000000000"
patches:
  - target:
      kind: ServiceAccount
      name: threadline-api
    patch: |-
      - op: replace
        path: /metadata/annotations/azure.workload.identity~1client-id
        value: "11111111-1111-1111-1111-111111111111"
