apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threadline-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dpc
  source:
    repoURL: https://github.com/ryanportfolio/fullbuild.ai.git
    targetRevision: main
    path: showcase/threadline/infra/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: threadline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
