<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foxglove Paper: the garden suites</title>
<style>
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 300 500;
  font-display: swap;
  src: url('../fonts/cormorant-garamond-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Cormorant Garamond';
  font-style: italic;
  font-weight: 300 500;
  font-display: swap;
  src: url('../fonts/cormorant-garamond-italic-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url('/prototype/foredge/fonts/inter-latin.woff2') format('woff2');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  overflow: auto;
  background: #fef1ec;
}

body {
  width: 1080px;
  height: 1350px;
  margin: 0;
  overflow: hidden;
  background: #fef1ec;
}

body {
  color: #11223f;
  -webkit-font-smoothing: antialiased;
}

.tile {
  position: relative;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  background: #fef1ec;
}

.head {
  position: absolute;
  left: 88px;
  top: 96px;
}

.eyebrow {
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #11223f;
}

.rule {
  display: block;
  width: 88px;
  height: 4px;
  margin-top: 32px;
  background: #ff5734;
}

.column {
  position: absolute;
  width: 452px;
}

.column--a {
  left: 88px;
  top: 340px;
}

.column--b {
  left: 580px;
  top: 480px;
}

.suite + .suite {
  margin-top: 102px;
}

.name {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 300;
  font-size: 110px;
  line-height: 1;
  letter-spacing: -0.005em;
  color: #11223f;
}

.swatch {
  display: block;
  width: 44px;
  height: 44px;
  margin-top: 24px;
  border-radius: 50%;
}

.swatch--hollyhock {
  background: #ec4f22;
}

.swatch--bryony {
  background: #193c35;
}

.swatch--yarrow {
  background: #e5ba2b;
}

.swatch--campion {
  background: #7e813c;
}

.swatch--tansy {
  background: #f6bba4;
}

.swatch--mallow {
  background: #c6d7d0;
}
</style>
</head>
<body>
<div class="tile">
  <div class="head">
    <p class="eyebrow">THE GARDEN SUITES</p>
    <span class="rule"></span>
  </div>
  <div class="column column--a">
    <div class="suite">
      <p class="name">Hollyhock</p>
      <span class="swatch swatch--hollyhock"></span>
    </div>
    <div class="suite">
      <p class="name">Bryony</p>
      <span class="swatch swatch--bryony"></span>
    </div>
    <div class="suite">
      <p class="name">Yarrow</p>
      <span class="swatch swatch--yarrow"></span>
    </div>
  </div>
  <div class="column column--b">
    <div class="suite">
      <p class="name">Campion</p>
      <span class="swatch swatch--campion"></span>
    </div>
    <div class="suite">
      <p class="name">Tansy</p>
      <span class="swatch swatch--tansy"></span>
    </div>
    <div class="suite">
      <p class="name">Mallow</p>
      <span class="swatch swatch--mallow"></span>
    </div>
  </div>
</div>
</body>
</html>
