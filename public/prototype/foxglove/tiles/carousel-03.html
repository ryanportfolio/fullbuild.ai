<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foxglove Paper, carousel frame 03</title>
<style>
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 300 500;
  font-display: block;
  src: url('../fonts/cormorant-garamond-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Cormorant Garamond';
  font-style: italic;
  font-weight: 300 500;
  font-display: block;
  src: url('../fonts/cormorant-garamond-italic-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('/prototype/foredge/fonts/inter-latin.woff2') format('woff2');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 1080px;
  height: 1350px;
  margin: 0;
  overflow: hidden;
  background: #fef1ec;
}

.frame {
  position: relative;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  background: #fef1ec;
}

.head {
  position: absolute;
  left: 88px;
  top: 96px;
}

.label {
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #11223f;
}

.rule {
  display: block;
  width: 88px;
  height: 4px;
  margin-top: 32px;
  background: #ff5734;
}

.sprig {
  position: absolute;
  left: 748px;
  top: -18px;
  width: 352px;
  height: 352px;
  transform: scaleX(-1);
}

.card {
  position: absolute;
  left: 140px;
  top: 395px;
  width: 800px;
  height: 560px;
  padding: 72px 80px;
  border: 2px solid #f6bba4;
  border-radius: 0;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.reply {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 300;
  font-size: 104px;
  line-height: 1.05;
  letter-spacing: -0.005em;
  color: #11223f;
}

.date {
  margin-top: 44px;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 300;
  font-size: 52px;
  line-height: 1.2;
  letter-spacing: 0.01em;
  color: #11223f;
}

.date span {
  display: inline-block;
  padding-bottom: 16px;
  border-bottom: 2px solid #ff5734;
}

.note {
  margin-top: 46px;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 300;
  font-size: 42px;
  line-height: 1.3;
  letter-spacing: 0.01em;
  color: #11223f;
}

.index {
  position: absolute;
  right: 88px;
  bottom: 96px;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: 0.2em;
  color: #11223f;
}
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <p class="label">THE RSVP CARD</p>
    <span class="rule"></span>
  </div>
  <img class="sprig" src="../img/sprig.png" alt="" width="352" height="352">
  <div class="card">
    <p class="reply">Kindly reply</p>
    <p class="date"><span>by the first of June</span></p>
    <p class="note">dinner in the garden, dancing after</p>
  </div>
  <p class="index">03 / 04</p>
</div>
</body>
</html>
