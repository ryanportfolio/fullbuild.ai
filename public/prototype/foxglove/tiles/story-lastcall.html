<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foxglove Paper story last call</title>
<style>
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 300 500;
  font-display: swap;
  src: url('../fonts/cormorant-garamond-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: italic;
  font-weight: 300 500;
  font-display: swap;
  src: url('../fonts/cormorant-garamond-italic-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url('/prototype/foredge/fonts/inter-latin.woff2') format('woff2');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  overflow: auto;
  background: #ff5734;
}

body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  overflow: hidden;
  background: #ff5734;
}

body {
  position: relative;
  color: #11223f;
  -webkit-font-smoothing: antialiased;
}

.copy {
  position: absolute;
  left: 96px;
  top: 200px;
  width: 888px;
}

.eyebrow {
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-size: 30px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.rule {
  display: block;
  width: 88px;
  height: 4px;
  margin-top: 32px;
  background: #11223f;
}

.display {
  margin-top: 62px;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 250px;
  font-weight: 300;
  line-height: 0.94;
  letter-spacing: -0.01em;
  font-feature-settings: 'lnum' 1;
}

.support {
  margin-top: 250px;
  max-width: 600px;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-size: 44px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: 0.03em;
}

.support span {
  white-space: nowrap;
}

.cta {
  position: absolute;
  left: 96px;
  top: 1250px;
  display: flex;
  align-items: center;
  gap: 28px;
  height: 114px;
  padding: 0 60px;
  border: 2px solid #fef1ec;
  border-radius: 999px;
  background: #fef1ec;
  color: #11223f;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-size: 44px;
  font-weight: 500;
  letter-spacing: 0.03em;
}

.cta svg {
  display: block;
  flex: 0 0 auto;
}
</style>
</head>
<body>
<div class="copy">
<p class="eyebrow">LAST CALL FOR JUNE</p>
<span class="rule"></span>
<h1 class="display">Order by <br>April 3</h1>
<p class="support">Suites from $480 for <span>one hundred invitations</span></p>
</div>
<p class="cta">
<svg width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true" focusable="false">
<g transform="rotate(-45 28 28)">
<rect x="5" y="19" width="30" height="18" rx="9" stroke="#11223f" stroke-width="4"></rect>
<rect x="21" y="19" width="30" height="18" rx="9" stroke="#11223f" stroke-width="4"></rect>
</g>
</svg>
Book your date
</p>
</body>
</html>
