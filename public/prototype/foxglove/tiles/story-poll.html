<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foxglove Paper story poll</title>
<style>
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 300 500;
  font-display: swap;
  src: url('../fonts/cormorant-garamond-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: italic;
  font-weight: 300 500;
  font-display: swap;
  src: url('../fonts/cormorant-garamond-italic-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url('/prototype/foredge/fonts/inter-latin.woff2') format('woff2');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  overflow: auto;
  background: #fef1ec;
}

body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  overflow: hidden;
  background: #fef1ec;
}

body {
  position: relative;
  color: #11223f;
  -webkit-font-smoothing: antialiased;
}

.corner {
  position: absolute;
  right: -150px;
  bottom: -120px;
  width: 1150px;
  height: auto;
  display: block;
}

.copy {
  position: absolute;
  left: 96px;
  top: 200px;
  width: 888px;
}

.eyebrow {
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-size: 30px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.rule {
  display: block;
  width: 88px;
  height: 4px;
  margin-top: 32px;
  background: #ff5734;
}

.display {
  margin-top: 60px;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 180px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.01em;
}

.options {
  position: absolute;
  left: 96px;
  top: 660px;
  width: 720px;
}

.pill {
  display: flex;
  align-items: center;
  gap: 36px;
  width: 720px;
  height: 152px;
  padding: 0 56px;
  border: 2px solid #f6bba4;
  border-radius: 999px;
  background: #ffffff;
  color: #11223f;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-size: 46px;
  font-weight: 500;
  letter-spacing: 0.03em;
}

.pill + .pill {
  margin-top: 44px;
}

.swatch {
  display: block;
  flex: 0 0 auto;
  width: 64px;
  height: 64px;
  border-radius: 50%;
}

.swatch--meadow {
  background: #7e813c;
}

.swatch--midnight {
  background: #11223f;
}
</style>
</head>
<body>
<img class="corner" src="../img/corner-b.png" alt="">
<div class="copy">
<p class="eyebrow">THE HOLLYHOCK SUITE</p>
<span class="rule"></span>
<h1 class="display">Which liner</h1>
</div>
<div class="options">
<p class="pill"><span class="swatch swatch--meadow"></span>Meadow</p>
<p class="pill"><span class="swatch swatch--midnight"></span>Midnight</p>
</div>
</body>
</html>
