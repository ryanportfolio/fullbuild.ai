<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foxglove Paper story teaser</title>
<style>
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 300 500;
  font-display: swap;
  src: url('../fonts/cormorant-garamond-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: italic;
  font-weight: 300 500;
  font-display: swap;
  src: url('../fonts/cormorant-garamond-italic-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url('/prototype/foredge/fonts/inter-latin.woff2') format('woff2');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  overflow: hidden;
  background: #fef1ec;
}

body {
  position: relative;
  color: #11223f;
  -webkit-font-smoothing: antialiased;
}

.stem {
  position: absolute;
  left: 140px;
  top: 690px;
  width: 1150px;
  height: auto;
  display: block;
}

.copy {
  position: absolute;
  left: 96px;
  top: 200px;
  width: 888px;
}

.eyebrow {
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-size: 30px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.rule {
  display: block;
  width: 88px;
  height: 4px;
  margin-top: 32px;
  background: #ff5734;
}

.display {
  margin-top: 60px;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 180px;
  font-weight: 300;
  line-height: 0.94;
  letter-spacing: -0.01em;
}

.support {
  margin-top: 52px;
  max-width: 720px;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-size: 44px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: 0.03em;
}
</style>
</head>
<body>
<img class="stem" src="../img/foxglove-stem.png" alt="">
<div class="copy">
<p class="eyebrow">FOXGLOVE PAPER</p>
<span class="rule"></span>
<h1 class="display">New suites <br>this week</h1>
<p class="support">Six of them, drawn by hand</p>
</div>
</body>
</html>
