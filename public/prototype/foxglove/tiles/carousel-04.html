<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foxglove Paper, carousel frame 04</title>
<style>
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 300 500;
  font-display: block;
  src: url('../fonts/cormorant-garamond-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Cormorant Garamond';
  font-style: italic;
  font-weight: 300 500;
  font-display: block;
  src: url('../fonts/cormorant-garamond-italic-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('/prototype/foredge/fonts/inter-latin.woff2') format('woff2');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  overflow: auto;
  background: #fef1ec;
}

body {
  width: 1080px;
  height: 1350px;
  margin: 0;
  overflow: hidden;
  background: #fef1ec;
}

.frame {
  position: relative;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  background: #fef1ec;
}

.head {
  position: absolute;
  left: 88px;
  top: 96px;
}

.label {
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #11223f;
}

.rule {
  display: block;
  width: 88px;
  height: 4px;
  margin-top: 32px;
  background: #ff5734;
}

.sprig {
  position: absolute;
  left: 380px;
  top: 912px;
  width: 640px;
  height: 640px;
  transform: scaleX(-1);
}

.envelope {
  position: absolute;
  left: 200px;
  top: 220px;
  width: 680px;
  height: 628px;
}

.flap {
  position: absolute;
  left: 12px;
  top: 0;
  width: 656px;
  height: 168px;
  background: #f6bba4;
  clip-path: polygon(0 100%, 40% 0, 60% 0, 100% 100%);
}

.dot {
  position: absolute;
  border-radius: 50%;
  background: #c6d7d0;
}

.d1 {
  left: 97px;
  top: 127px;
  width: 26px;
  height: 26px;
}

.d2 {
  left: 158px;
  top: 102px;
  width: 20px;
  height: 20px;
}

.d3 {
  left: 224px;
  top: 72px;
  width: 16px;
  height: 16px;
}

.d4 {
  left: 419px;
  top: 67px;
  width: 18px;
  height: 18px;
}

.d5 {
  left: 469px;
  top: 101px;
  width: 22px;
  height: 22px;
}

.d6 {
  left: 532px;
  top: 132px;
  width: 26px;
  height: 26px;
}

.d7 {
  left: 79px;
  top: 145px;
  width: 14px;
  height: 14px;
}

.pocket {
  position: absolute;
  left: 0;
  top: 168px;
  width: 680px;
  height: 460px;
  border: 2px solid #f6bba4;
  border-radius: 0;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
}

.addressed {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 70px;
  line-height: 1.1;
  letter-spacing: -0.005em;
  color: #11223f;
}

.amp {
  color: #ff5734;
}

.seal {
  position: absolute;
  left: 275px;
  top: 103px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: #ec4f22;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 66px;
  line-height: 1;
  color: #fef1ec;
}

.support {
  position: absolute;
  left: 88px;
  top: 930px;
  width: 700px;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 300;
  font-size: 44px;
  line-height: 1.3;
  letter-spacing: 0.01em;
  color: #11223f;
}

.cta {
  position: absolute;
  left: 88px;
  top: 1050px;
  display: inline-flex;
  align-items: center;
  height: 104px;
  padding: 0 60px;
  border: 2px solid #ff5734;
  border-radius: 999px;
  background: transparent;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 40px;
  line-height: 1.2;
  letter-spacing: 0.03em;
  color: #11223f;
}

.index {
  position: absolute;
  right: 88px;
  bottom: 96px;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: 0.2em;
  color: #11223f;
}
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <p class="label">THE DETAILS</p>
    <span class="rule"></span>
  </div>
  <img class="sprig" src="../img/sprig.png" alt="" width="640" height="640">
  <div class="envelope">
    <div class="flap">
      <span class="dot d1"></span>
      <span class="dot d2"></span>
      <span class="dot d3"></span>
      <span class="dot d4"></span>
      <span class="dot d5"></span>
      <span class="dot d6"></span>
      <span class="dot d7"></span>
    </div>
    <div class="pocket">
      <p class="addressed">Iris <span class="amp">&amp;</span> Theo</p>
    </div>
    <div class="seal">F</div>
  </div>
  <p class="support">Envelope, liner, and the wax seal</p>
  <p class="cta">Start with a sample</p>
  <p class="index">04 / 04</p>
</div>
</body>
</html>
