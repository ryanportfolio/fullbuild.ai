<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forecourt Market: the last call story</title>
<style>
@font-face {
  font-family: 'Lora';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/lora-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/inter-latin.woff2') format('woff2');
}

:root {
  --oat: #f5f0e4;
  --rye: #eae2cd;
  --hedge: #1e2a1e;
  --marigold: #f6b83c;
  --radish: #c8502f;
  --cornflower: #5b7fae;
  --leaf: #6a9e57;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', Helvetica, Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { overflow: auto; background: var(--oat); }

body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--oat);
  color: var(--hedge);
  -webkit-font-smoothing: antialiased;
}

.tile {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  text-align: center;
}

.band {
  padding: 34px 60px;
  background: var(--marigold);
  font-family: var(--sans);
  font-weight: 600;
  font-size: 34px;
  line-height: 1.25;
}

.stack { padding: 150px 80px 0; }

.eyebrow {
  margin: 0;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 32px;
  line-height: 1.2;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.display {
  margin: 72px 0 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 168px;
  line-height: 1.06;
  letter-spacing: -0.01em;
}

.beads {
  display: flex;
  justify-content: center;
  gap: 26px;
  margin-top: 88px;
}

.bead { width: 40px; height: 40px; border-radius: 999px; }
.bead-radish { background: var(--radish); }
.bead-cornflower { background: var(--cornflower); }
.bead-marigold { background: var(--marigold); }
.bead-leaf { background: var(--leaf); }
.bead-hedge { background: var(--hedge); }

.details {
  margin: 88px auto 0;
  max-width: 800px;
  padding: 64px 64px 68px;
  border-radius: 48px;
  background: var(--rye);
  text-align: center;
}

.details p {
  margin: 0 0 18px;
  font-family: var(--sans);
  font-weight: 400;
  font-size: 34px;
  line-height: 1.4;
}

.details p:last-child { margin-bottom: 0; }
.details strong { font-weight: 600; }

.cta {
  display: inline-flex;
  align-items: center;
  margin-top: 96px;
  padding: 38px 84px;
  border-radius: 999px;
  background: var(--marigold);
  color: var(--hedge);
  font-family: var(--sans);
  font-weight: 600;
  font-size: 42px;
  line-height: 1.2;
}

.swipe {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 96px;
  font-family: var(--sans);
  font-weight: 400;
  font-size: 30px;
  line-height: 1.3;
}
</style>
</head>
<body>
<div class="tile">
  <p class="band">Last call for the yard</p>
  <div class="stack">
    <p class="eyebrow">Forecourt Market</p>
    <h1 class="display">This Saturday<br>and Sunday</h1>
    <div class="beads" aria-hidden="true">
      <span class="bead bead-radish"></span>
      <span class="bead bead-cornflower"></span>
      <span class="bead bead-marigold"></span>
      <span class="bead bead-leaf"></span>
      <span class="bead bead-hedge"></span>
    </div>
    <div class="details">
      <p><strong>Forty makers</strong> and three neighbors in one yard</p>
      <p><strong>Ten to five</strong> both days, free to walk in</p>
      <p><strong>Saturday at dusk</strong> the projector comes out</p>
    </div>
    <p class="cta">Plan your Saturday</p>
  </div>
  <p class="swipe">12 Water Street, Hudson &middot; swipe up for the map</p>
</div>
</body>
</html>
