<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forecourt Market, billboard</title>
<style>
@font-face {
  font-family: 'Lora';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/lora-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/inter-latin.woff2') format('woff2');
}

:root {
  --oat: #f5f0e4;
  --hedge: #1e2a1e;
  --marigold: #f6b83c;
  --radish: #c8502f;
  --cornflower: #5b7fae;
  --leaf: #6a9e57;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', Helvetica, Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { overflow: auto; background: var(--oat); }

body {
  width: 970px;
  height: 250px;
  overflow: hidden;
  background: var(--oat);
  color: var(--hedge);
}

.frame {
  position: relative;
  display: flex;
  align-items: center;
  gap: 48px;
  width: 970px;
  height: 250px;
  padding: 40px 48px;
}

.copy { flex: 1; }

.eyebrow {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.display {
  margin-top: 14px;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 52px;
  line-height: 1.08;
  letter-spacing: -0.01em;
}

.date {
  margin-top: 14px;
  font-family: var(--sans);
  font-weight: 400;
  font-size: 18px;
  line-height: 1.3;
}

.side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
}

.beads { display: flex; gap: 12px; }
.bead { width: 18px; height: 18px; border-radius: 999px; }
.bead-radish { background: var(--radish); }
.bead-cornflower { background: var(--cornflower); }
.bead-leaf { background: var(--leaf); }
.bead-hedge { background: var(--hedge); }

.pill {
  display: inline-flex;
  align-items: center;
  padding: 15px 34px;
  border-radius: 999px;
  background: var(--marigold);
  color: var(--hedge);
  font-family: var(--sans);
  font-weight: 600;
  font-size: 17px;
  line-height: 1.2;
}
</style>
</head>
<body>
<div class="frame">
  <div class="copy">
    <p class="eyebrow">Forecourt Market &middot; Hudson NY</p>
    <h1 class="display">One yard, forty makers</h1>
    <p class="date">October 3 and 4, in the yard at Foundry Works, free to walk in</p>
  </div>
  <div class="side">
    <span class="beads" aria-hidden="true"><span class="bead bead-radish"></span><span class="bead bead-cornflower"></span><span class="bead bead-leaf"></span><span class="bead bead-hedge"></span></span>
    <span class="pill">Plan your Saturday</span>
  </div>
</div>
</body>
</html>
