<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forecourt Market, medium rectangle</title>
<style>
@font-face {
  font-family: 'Lora';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/lora-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/inter-latin.woff2') format('woff2');
}

:root {
  --oat: #f5f0e4;
  --hedge: #1e2a1e;
  --marigold: #f6b83c;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', Helvetica, Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { overflow: auto; background: var(--oat); }

body {
  width: 300px;
  height: 250px;
  overflow: hidden;
  background: var(--oat);
  color: var(--hedge);
}

.frame {
  position: relative;
  width: 300px;
  height: 250px;
  padding: 24px;
  overflow: hidden;
}

.eyebrow {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.display {
  margin-top: 12px;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 34px;
  line-height: 1.08;
  letter-spacing: -0.01em;
}

.date {
  margin-top: 10px;
  font-family: var(--sans);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.3;
}

.pill {
  position: absolute;
  left: 24px;
  bottom: 24px;
  display: inline-flex;
  align-items: center;
  padding: 12px 26px;
  border-radius: 999px;
  background: var(--marigold);
  color: var(--hedge);
  font-family: var(--sans);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.2;
}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Forecourt Market</p>
  <h1 class="display">One yard, forty makers</h1>
  <p class="date">October 3 and 4, Hudson NY</p>
  <span class="pill">Plan your Saturday</span>
</div>
</body>
</html>
