<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forecourt Market, half page</title>
<style>
@font-face {
  font-family: 'Lora';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/lora-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/inter-latin.woff2') format('woff2');
}

:root {
  --oat: #f5f0e4;
  --rye: #eae2cd;
  --hedge: #1e2a1e;
  --marigold: #f6b83c;
  --radish: #c8502f;
  --cornflower: #5b7fae;
  --leaf: #6a9e57;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', Helvetica, Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { overflow: auto; background: var(--oat); }

body {
  width: 300px;
  height: 600px;
  overflow: hidden;
  background: var(--oat);
  color: var(--hedge);
}

.frame {
  position: relative;
  width: 300px;
  height: 600px;
  padding: 28px 24px;
  overflow: hidden;
  text-align: center;
}

.eyebrow {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.display {
  margin-top: 16px;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 40px;
  line-height: 1.08;
  letter-spacing: -0.01em;
}

.beads {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 22px;
}

.bead { width: 14px; height: 14px; border-radius: 999px; }
.bead-radish { background: var(--radish); }
.bead-cornflower { background: var(--cornflower); }
.bead-marigold { background: var(--marigold); }
.bead-leaf { background: var(--leaf); }
.bead-hedge { background: var(--hedge); }

.roster {
  margin: 24px auto 0;
  padding: 20px 18px 22px;
  border-radius: 24px;
  background: var(--rye);
}

.roster p {
  margin: 0 0 8px;
  font-family: var(--sans);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.35;
}

.roster p:last-child { margin-bottom: 0; }
.roster strong { font-weight: 600; }

.date {
  margin-top: 22px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 17px;
  line-height: 1.3;
}

.pill {
  position: absolute;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  padding: 14px 30px;
  border-radius: 999px;
  background: var(--marigold);
  color: var(--hedge);
  font-family: var(--sans);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.2;
}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Forecourt Market</p>
  <h1 class="display">One yard,<br>forty makers</h1>
  <div class="beads" aria-hidden="true">
    <span class="bead bead-radish"></span>
    <span class="bead bead-cornflower"></span>
    <span class="bead bead-marigold"></span>
    <span class="bead bead-leaf"></span>
    <span class="bead bead-hedge"></span>
  </div>
  <div class="roster">
    <p><strong>Foredge Books</strong> at the tables</p>
    <p><strong>Foxglove Paper</strong> at the press</p>
    <p><strong>Foxtail Drive-In</strong> after dark</p>
    <p>and forty studios, doors open</p>
  </div>
  <p class="date">October 3 and 4<br>The yard at Foundry Works, Hudson</p>
  <span class="pill">Plan your Saturday</span>
</div>
</body>
</html>
