<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foxtail Drive-In, skyscraper</title>
<style>
@font-face {
  font-family: 'Anton';
  font-style: normal;
  font-weight: 400;
  font-display: block;
  src: url('../fonts/anton-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Playfair Display';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/playfair-display-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 300 600;
  font-display: block;
  src: url('../fonts/inter-latin.woff2') format('woff2');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  overflow: auto;
  background: #fff8f1;
}

body {
  width: 160px;
  height: 600px;
  margin: 0;
  overflow: hidden;
  background: #fff8f1;
}

.frame {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 160px;
  height: 600px;
  padding: 32px 16px;
  overflow: hidden;
  background: #fff8f1;
  color: #006eff;
  text-align: center;
}

.eyebrow {
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 16px;
  line-height: 1.3;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.rule {
  width: 40px;
  height: 1.5px;
  margin: 22px 0;
  background: #006eff;
}

.display {
  font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
  font-weight: 400;
  font-size: 31px;
  line-height: 1.05;
  letter-spacing: -0.01em;
}

.date {
  margin-top: 34px;
  font-family: 'Anton', 'Arial Narrow', 'Franklin Gothic Medium', sans-serif;
  font-weight: 400;
  font-size: 62px;
  line-height: 0.95;
  letter-spacing: 0;
  text-transform: uppercase;
}

.support {
  margin-top: 34px;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.45;
  letter-spacing: -0.01em;
}

.pill {
  position: absolute;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  padding: 11px 16px;
  border: 1.5px solid #006eff;
  border-radius: 999px;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: 0.02em;
  color: #006eff;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Foxtail<br>Drive-In</p>
  <span class="rule"></span>
  <h1 class="display">Opening night</h1>
  <p class="date">June<br>12</p>
  <p class="support">Season passes end that night</p>
  <span class="pill">Get the pass</span>
</div>
</body>
</html>
