<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foxtail Drive-In, story last call</title>
<style>
@font-face {
  font-family: 'Anton';
  font-style: normal;
  font-weight: 400;
  font-display: block;
  src: url('../fonts/anton-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Playfair Display';
  font-style: normal;
  font-weight: 400 600;
  font-display: block;
  src: url('../fonts/playfair-display-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 300 600;
  font-display: block;
  src: url('../fonts/inter-latin.woff2') format('woff2');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  overflow: auto;
  background: #006eff;
}

body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  overflow: hidden;
  background: #006eff;
}

.frame {
  position: relative;
  width: 1080px;
  height: 1920px;
  padding: 0 96px;
  overflow: hidden;
  background: #006eff;
  color: #fff8f1;
}

.eyebrow {
  position: absolute;
  left: 96px;
  top: 264px;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.display {
  position: absolute;
  left: 96px;
  top: 366px;
  width: 888px;
  font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
  font-weight: 400;
  font-size: 100px;
  line-height: 1.04;
  letter-spacing: -0.01em;
}

.date {
  position: absolute;
  left: 96px;
  top: 690px;
  font-family: 'Anton', 'Arial Narrow', 'Franklin Gothic Medium', sans-serif;
  font-weight: 400;
  font-size: 300px;
  line-height: 0.95;
  letter-spacing: 0;
  text-transform: uppercase;
}

.rule {
  position: absolute;
  left: 96px;
  width: 888px;
  top: 1122px;
  height: 1.5px;
  background: #fff8f1;
}

.support {
  position: absolute;
  left: 96px;
  top: 1182px;
  width: 700px;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 300;
  font-size: 34px;
  line-height: 1.4;
  letter-spacing: -0.01em;
}

.cue {
  position: absolute;
  left: 50%;
  bottom: 320px;
  transform: translateX(-50%);
}

.pill {
  display: inline-flex;
  align-items: center;
  padding: 22px 52px;
  border-radius: 999px;
  background: #fff8f1;
  font-family: 'Inter', Helvetica, Arial, sans-serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: 0.02em;
  color: #006eff;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Last call for passes</p>
  <h1 class="display">Season passes end opening night</h1>
  <p class="date">June 12</p>
  <span class="rule"></span>
  <p class="support">$45 covers every movie all summer</p>
  <div class="cue">
    <span class="pill">Get the pass</span>
  </div>
</div>
</body>
</html>
